spring.application.name=booking-service
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.label=main
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.eventClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eventClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.eventClient.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.eventClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.eventClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.eventClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.eventClient.automatic-transition-from-open-to-half-open-enabled=true
